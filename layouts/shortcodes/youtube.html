{{ $id := .Get "id" | default (.Get 0) }}
<div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden;">
  <iframe src="https://www.youtube.com/embed/{{ $id }}" loading="lazy" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border:0;" allowfullscreen title="{{ .Get "title" | default "Project video on YouTube" }}"></iframe>
</div>
