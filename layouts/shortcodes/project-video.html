{{- $project := .Page -}}
{{- with .Get "project" -}}{{- $project = site.GetPage . -}}{{- end -}}
{{- if not $project -}}{{- errorf "Video project not found: %s" (.Get "project") -}}{{- end -}}
{{- with $project.Params.resume.video -}}
<div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden;">
  <iframe src="https://www.youtube.com/embed/{{ . }}" loading="lazy" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border:0;" allowfullscreen title="{{ $project.Title }} project demonstration"></iframe>
</div>
{{- end -}}
