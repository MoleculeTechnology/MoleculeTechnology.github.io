<section class="pyramid" data-pyramid data-renderer="static" aria-label="Connected specializations">
  <div class="pyramid-viewport" data-viewport>
    <canvas data-canvas tabindex="0" role="img" aria-label="Rotatable pyramid connecting programming, design, art, and animation" aria-describedby="pyramid-instructions"></canvas>
    <svg class="pyramid-fallback" viewBox="0 0 600 460" aria-hidden="true" preserveAspectRatio="none"><path d="M140 340 320 85 485 300 140 340"/><path class="mint-stroke" d="M140 340 185 180 485 300M185 180 320 85"/></svg>
    <svg class="pyramid-leaders" data-leaders aria-hidden="true">{{ range slice "programming" "design" "art" "animation" }}<line data-leader="{{ . }}"/>{{ end }}</svg>
    <ul class="pyramid-labels" aria-label="Specializations"><li data-label="programming"><span>{ programming }</span></li><li data-label="design"><span>{ design }</span></li><li data-label="art"><span>{ art }</span></li><li data-label="animation"><span>{ animation }</span></li></ul>
    {{ range slice "programming" "design" "art" "animation" }}<span class="pyramid-point" data-point="{{ . }}" aria-hidden="true"></span>{{ end }}
  </div>
  <div class="pyramid-caption"><span class="eyebrow brace-label">{ specializations }</span><div class="pyramid-controls" data-controls hidden><button type="button" data-rotate="-1" aria-label="Rotate pyramid left">←</button><button type="button" data-play aria-label="Pause rotation">Pause</button><button type="button" data-rotate="1" aria-label="Rotate pyramid right">→</button><button type="button" data-reset aria-label="Reset pyramid orientation">Reset</button></div></div>
  <p id="pyramid-instructions" class="pyramid-instructions" data-instructions hidden>Drag to rotate · Arrow keys to turn · Space to pause</p>
</section>
