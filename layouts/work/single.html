{{ define "main" }}
<article class="case-study site-width">
  <a class="back-link" href="{{ "work/" | relURL }}">← Selected work</a>
  <header class="case-header"><p class="eyebrow mint-text">{{ .Params.context }}</p><h1>{{ .Title }}</h1><p class="case-deck">{{ .Description }}</p><dl class="case-facts"><div><dt>Contribution</dt><dd>{{ .Params.contribution }}</dd></div><div><dt>Context</dt><dd>{{ .Params.projectContext }}</dd></div></dl></header>
  <figure class="case-hero {{ .Params.imageClass }}">{{ partial "portfolio/image.html" (dict "source" .Params.hero "alt" .Params.heroAlt "loading" "eager" "sizes" "(max-width: 760px) 100vw, 88vw") }}<figcaption>{{ .Params.heroCaption }}</figcaption></figure>
  <div class="case-body">{{ .Content }}</div>
  <div class="case-next"><p>For project inquiries + collaborations.</p><a class="text-link" href="{{ "contact/" | relURL }}">Contact me <span aria-hidden="true">↗</span></a></div>
</article>
{{ end }}
