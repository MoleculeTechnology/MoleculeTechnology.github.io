<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Molecule / Social icon colors</title>
  <link rel="stylesheet" href="social-icon-colors.css">
  <script defer src="social-icon-colors/inventory.js"></script>
  <script defer src="social-icon-colors.js"></script>
</head>
<body>
  <header class="concept-header">
    <p class="eyebrow">Molecule / Color study</p>
    <h1>Social icon colors</h1>
    <p>Blue LinkedIn, red YouTube, and white GitHub on black. Link names stay ghost white.</p>
    <div class="controls">
      <div class="choices" role="group" aria-label="Icon colors">
        <button type="button" data-treatment="white" aria-pressed="false">White <span class="samples" aria-hidden="true"></span></button>
        <button type="button" data-treatment="brand" aria-pressed="true">Brand colors <span class="samples brand" aria-hidden="true"></span></button>
      </div>
      <label>Page <select id="page"></select></label>
      <label>Width <select id="width"><option value="1280">Desktop / 1280px</option><option value="390">Phone / 390px</option><option value="320">Small phone / 320px</option></select></label>
      <label>Show <select id="view"><option value="links">Social links</option><option value="whole">Page from top</option></select></label>
      <a id="open" href="social-icon-colors/contact-brand.html#concept-social-links" target="_blank" rel="noopener">Open full page ↗</a>
    </div>
    <p id="status" role="status" aria-live="polite">Loading Contact…</p>
  </header>
  <main class="preview">
    <iframe title="Contact / brand color social icons" src="social-icon-colors/contact-brand.html#concept-social-links"></iframe>
  </main>
  <footer class="concept-footer">Brand colors are now applied to the main preview. Use White to compare the earlier treatment on any of the 12 pages.</footer>
</body>
</html>
